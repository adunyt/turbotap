name: build-wda-trollstore

# Builds WebDriverAgent as an unsigned .ipa for TrollStore (no Apple Developer
# account needed — TrollStore signs it on-device). Trigger manually:
# Actions -> "build-wda-trollstore" -> Run workflow.
#
# Uses the latest appium/WebDriverAgent tag, which handles current Xcode's
# Swift Testing framework embedding correctly (the pinned 16.14.0 did not, and
# crashed on iOS 17 with a missing lib_TestingInterop.dylib). The only free
# GitHub-hosted runner here is macos-latest (Apple Silicon, Xcode 16+); macos-13
# is retired and macos-14 is not available to this account. The turbo patch is
# for 16.14.0 and is applied best-effort; if it does not apply, a stock WDA is
# built (turbotap works against stock WDA, just without the speed patch).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      WDA_REF: v16.15.3
    steps:
      - name: Checkout turbotap (for patches/wda-turbo.patch)
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Clone appium/WebDriverAgent
        run: |
          git clone https://github.com/appium/WebDriverAgent.git wda
          cd wda
          git checkout --force "$WDA_REF"

      - name: Apply wda-turbo patch (best-effort)
        run: |
          cd wda
          if git apply "$GITHUB_WORKSPACE/patches/wda-turbo.patch" 2>/dev/null; then
            echo "wda-turbo patch applied on $WDA_REF"
          else
            echo "wda-turbo patch did NOT apply on $WDA_REF — building stock WDA (turbotap supports stock)."
          fi

      - name: Build WebDriverAgentRunner (unsigned)
        run: |
          cd wda
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload/*.app into an .ipa
        run: |
          cd wda
          APP="$(find build/Build/Products -type d -name 'WebDriverAgentRunner-Runner.app' | head -1)"
          test -n "$APP" || { echo "Runner.app not found"; exit 1; }
          echo "app: $APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          find Payload -name '*.dSYM' -exec rm -rf {} + 2>/dev/null || true   # dSYM breaks ldid signing on-device
          echo "--- embedded Frameworks (for reference) ---"
          ls Payload/WebDriverAgentRunner-Runner.app/Frameworks 2>/dev/null || true
          zip -qry WebDriverAgentRunner.ipa Payload
          ls -la WebDriverAgentRunner.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-ipa
          path: wda/WebDriverAgentRunner.ipa
          if-no-files-found: error
